services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/esen_exam
      SESSION_SECRET: dev-only-secret-do-not-use-in-production-0123456789
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esen_exam
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
